<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#163a2a" />
  <title>ผลงานจัดสวน — โชว์เคส</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="showcase.css" />
</head>
<body>
  <header class="topbar sc-header-hideable">
    <div>
      <p class="eyebrow">LANDSCAPE SHOWCASE</p>
      <h1>ผลงานและแบบสวนของเรา</h1>
    </div>
  </header>

  <nav class="tabs sc-header-hideable" aria-label="เมนูหลัก">
    <button class="tab active" data-page="showcaseHome">หน้าแรก</button>
    <button class="tab" data-page="showcaseStyles">แบบสวน</button>
    <button class="tab" data-page="showcasePlants">ต้นไม้</button>
  </nav>

  <section id="showcaseHomePage" class="page active sc-hero">
    <div class="sc-hero-bg" id="scHeroBg"></div>

    <div class="sc-hero-topbar">
      <button type="button" class="sc-icon-btn" id="scMenuBtn" aria-label="เมนู">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="sc-icon-btn" id="scBellBtn" aria-label="แจ้งเตือน">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22Zm7-6.2V11a7 7 0 0 0-5.6-6.86V3a1.4 1.4 0 1 0-2.8 0v1.14A7 7 0 0 0 5 11v4.8L3 17.8V19h18v-1.2l-2-2Z" fill="#fff"/></svg>
      </button>
    </div>
    <div id="scMenuDropdown" class="sc-menu-dropdown">
      <button type="button" onclick="showPage('showcaseHome');closeScMenu()">หน้าแรก</button>
      <button type="button" onclick="showPage('showcaseStyles');closeScMenu()">แบบสวน</button>
      <button type="button" onclick="showPage('showcasePlants');closeScMenu()">ต้นไม้</button>
    </div>

    <div class="sc-hero-content">
      <img class="sc-hero-logo" src="assets/rinlada-logo.webp" alt="รินลดา พันธุ์ไม้" />
      <h1 class="sc-hero-title">ยินดีต้อนรับสู่<br />รินลดา พันธุ์ไม้</h1>
      <p class="sc-hero-sub">ออกแบบสวนในฝันของคุณ</p>

      <div class="sc-hero-buttons">
        <button type="button" class="sc-glass-btn" onclick="showPage('showcaseStyles')">
          <span class="sc-glass-icon">🏡</span>
          <span>แบบสวน</span>
        </button>
        <button type="button" class="sc-glass-btn" onclick="showPage('showcasePlants')">
          <span class="sc-glass-icon">🌿</span>
          <span>ฐานข้อมูลต้นไม้</span>
        </button>
      </div>

      <button type="button" class="sc-cta-btn" onclick="showPage('showcaseStyles')">
        <span class="sc-cta-icon">🌱</span>
        เริ่มออกแบบสวนของคุณ
        <span class="sc-cta-arrow">›</span>
      </button>
    </div>
  </section>

  <main class="container">
    <section id="showcaseStylesPage" class="page">
      <button type="button" class="sc-back-link" onclick="showPage('showcaseHome')">← กลับหน้าแรก</button>
      <div class="page-head">
        <div>
          <p class="eyebrow">GARDEN STYLES</p>
          <h2>แบบสวนของเรา</h2>
        </div>
      </div>
      <div class="filters">
        <input id="scStyleSearch" class="input" type="search" placeholder="ค้นหาชื่อแบบสวน หมวด หรือคำอธิบาย" />
        <select id="scStyleCategoryFilter" class="input">
          <option value="">ทุกหมวด</option>
          <option>Modern</option>
          <option>Tropical</option>
          <option>Japanese</option>
          <option>English</option>
          <option>Mediterranean</option>
          <option>Desert</option>
          <option>Natural</option>
          <option>Water</option>
          <option>Commercial</option>
          <option>Small Space</option>
        </select>
      </div>
      <div id="scStyleCount" class="meta"></div>
      <div id="scStyleList" class="style-grid"></div>
    </section>

    <section id="showcasePlantsPage" class="page">
      <button type="button" class="sc-back-link" onclick="showPage('showcaseHome')">← กลับหน้าแรก</button>
      <div class="page-head">
        <div>
          <p class="eyebrow">PLANT GALLERY</p>
          <h2>ต้นไม้ในผลงานของเรา</h2>
        </div>
      </div>
      <div class="filters">
        <input id="scPlantSearch" class="input" type="search" placeholder="ค้นหาชื่อต้นไม้" />
      </div>
      <div id="scPlantCount" class="meta"></div>
      <div id="scPlantList" class="showcase-plant-grid"></div>
      <div class="plant-load-more">
        <button id="scLoadMorePlantsBtn" class="btn btn-secondary" style="display:none">โหลดเพิ่ม</button>
      </div>
    </section>
  </main>

  <dialog id="scStyleDetailDialog" class="modal style-detail-modal">
    <div class="style-detail-wrap">
      <div class="modal-head">
        <div>
          <p id="scStyleDetailCategory" class="eyebrow"></p>
          <h3 id="scStyleDetailName"></h3>
        </div>
        <button type="button" class="icon-btn close-dialog">×</button>
      </div>

      <div id="scStyleDetailHero" class="style-detail-hero"></div>
      <div id="scStyleDetailThumbs" class="style-detail-thumbs"></div>
      <p id="scStyleDetailDescription" class="style-detail-description"></p>

      <div class="detail-grid">
        <div class="detail-box"><span>งบประมาณโดยประมาณ</span><strong id="scStyleDetailBudget"></strong></div>
        <div class="detail-box"><span>การดูแล</span><strong id="scStyleDetailMaintenance"></strong></div>
        <div class="detail-box"><span>ระดับความยาก</span><strong id="scStyleDetailDifficulty"></strong></div>
        <div class="detail-box"><span>เหมาะกับ</span><strong id="scStyleDetailSuitable"></strong></div>
      </div>

      <div class="detail-section">
        <h4>ต้นไม้ที่ใช้ในสวนนี้</h4>
        <div id="scStyleDetailLinkedPlants" class="style-linked-plants"></div>
      </div>
      <div class="detail-section">
        <h4>พรรณไม้แนะนำ</h4>
        <div id="scStyleDetailPlants" class="chips"></div>
      </div>
      <div class="detail-section">
        <h4>วัสดุแนะนำ</h4>
        <div id="scStyleDetailMaterials" class="chips"></div>
      </div>
      <div class="detail-section">
        <h4>แนวทางสีและบรรยากาศ</h4>
        <p id="scStyleDetailMood" class="meta"></p>
      </div>
    </div>
  </dialog>

  <dialog id="scPlantLightbox" class="modal showcase-lightbox">
    <div class="style-detail-wrap">
      <div class="modal-head">
        <h3 id="scPlantLightboxName"></h3>
        <button type="button" class="icon-btn close-dialog">×</button>
      </div>
      <img id="scPlantLightboxImage" class="showcase-lightbox-img" alt="" />
    </div>
  </dialog>

  <script src="data/garden-styles-data.js"></script>
  <script src="showcase.js"></script>
</body>
</html>
